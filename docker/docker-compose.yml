# Gemini MCP self-hosting: Caddy(HTTPS) → gateway → { MCP 서버, 대시보드 }
# 설정은 이 폴더의 .env 에서 읽습니다 (docker/docker.ps1 setup 또는 docker/docker.sh setup 이 생성, 예시는 .env.example).
#
#   클라이언트 ──HTTPS──▶ caddy ──▶ gateway ─┬─ /mcp, /skill, /health ─▶ gemini-mcp (API 키 인증은 gateway 가)
#                                          ├─ /api/admin            ─▶ gateway 관리 API (대시보드 세션)
#                                          └─ 그 외                  ─▶ dashboard (Nuxt)
# 호스트에 포트를 게시하는 것은 caddy 뿐입니다.
name: gemini-mcp

services:
  gemini-mcp:
    # 소스(src/)가 필요하므로 빌드 컨텍스트는 저장소 루트입니다. 제외 목록은 Dockerfile.dockerignore.
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: gemini-mcp:latest
    container_name: gemini-mcp
    restart: unless-stopped
    expose:
      - "5100"
    user: "${DOCKER_UID:-1654}:${DOCKER_GID:-1654}"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY 환경 변수 또는 .env 설정이 필요합니다}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_PRO_MODEL: ${GEMINI_PRO_MODEL:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-}
      GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-}
      # Claude 가 넘기는 호스트 경로를 컨테이너의 /share 로 변환하고, 결과 경로는 다시 호스트 경로로 돌려줍니다.
      GEMINI_MCP_PATH_MAPS: ${HOST_SHARE_DIR:?HOST_SHARE_DIR 를 .env 에 설정하세요}=/share
      GEMINI_MCP_OUTPUT_DIR: /share/${OUTPUT_SUBDIR:-gemini-mcp-output}
    volumes:
      - ${HOST_SHARE_DIR}:/share
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # 관리 대시보드 (Nuxt 4 + Vuetify, Deno). gateway 를 통해서만 접근합니다.
  dashboard:
    build:
      context: ../dashboard
    image: gemini-mcp-dashboard:latest
    container_name: gemini-mcp-dashboard
    restart: unless-stopped
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # API 키 인증 · 로그 · 모니터링 · 라우팅 (Deno). 키/관리자/로그/지표는 gateway-data 볼륨의 Deno KV 에 저장됩니다.
  gateway:
    build:
      context: ../gateway
    image: gemini-mcp-gateway:latest
    container_name: gemini-mcp-gateway
    restart: unless-stopped
    depends_on:
      gemini-mcp:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      MCP_UPSTREAM: http://gemini-mcp:5100
      DASHBOARD_UPSTREAM: http://dashboard:3000
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
    volumes:
      - gateway-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # TLS 종단 + zstd/gzip 압축 리버스 프록시 (설정: Caddyfile)
  caddy:
    image: caddy:2.10.2-alpine
    container_name: gemini-mcp-caddy
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    # 기본은 호스트의 127.0.0.1 에만 노출합니다. 외부에 공개해도 MCP 는 API 키, 대시보드는 관리자 로그인이 필요합니다.
    # 컨테이너 안에서도 같은 포트로 수신해야 HTTP/3 Alt-Svc 가 호스트 포트를 광고합니다. udp = HTTP/3(QUIC).
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-5100}:${MCP_PORT:-5100}/tcp"
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-5100}:${MCP_PORT:-5100}/udp"
    environment:
      MCP_PORT: ${MCP_PORT:-5100}
      MCP_DOMAIN: ${MCP_DOMAIN:-localhost, 127.0.0.1}
      MCP_TLS: ${MCP_TLS:-internal}
      MCP_DEFAULT_SNI: ${MCP_DEFAULT_SNI:-127.0.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 로컬 CA·인증서 보존 (볼륨을 지우면 새 루트 인증서를 다시 신뢰시켜야 합니다)
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    # 신뢰 저장소만 쓰기 가능(tmpfs)으로 둡니다: Caddy 가 시작할 때 로컬 CA 루트를 넣고
    # update-ca-certificates 가 /usr/share/ca-certificates 로부터 번들을 다시 만듭니다.
    tmpfs:
      - /tmp
      - /usr/local/share/ca-certificates
      - /etc/ssl/certs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  gateway-data:
  caddy-data:
  caddy-config:
